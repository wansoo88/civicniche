<!doctype html><html lang="ko"><head><meta charset="utf-8"/><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(135deg,#eef3ff 0%,#ffffff 55%);color:#16181d;
    padding:64px 70px;position:relative}
  .brand{font-size:24px;font-weight:800;letter-spacing:-.01em}
  .brand span{color:#1d4ed8}
  .badge{display:inline-block;margin-top:30px;background:#eef2ff;color:#3730a3;font-size:18px;font-weight:700;padding:7px 16px;border-radius:8px}
  h1{font-size:60px;line-height:1.18;letter-spacing:-.02em;margin:22px 0 0;max-width:1000px}
  .sub{font-size:25px;color:#374151;margin-top:22px;max-width:900px;line-height:1.45}
  .chips{position:absolute;left:70px;bottom:120px;display:flex;gap:12px}
  .chip{background:#fff;border:1.5px solid #e2e8f0;border-radius:999px;padding:10px 18px;font-size:19px;font-weight:700;color:#374151}
  .chip b{color:#1d4ed8}
  .bar{position:absolute;left:0;bottom:0;width:1200px;height:64px;background:#1d4ed8;display:flex;align-items:center;padding:0 70px;color:#fff;font-size:21px;font-weight:600}
  .bar .url{font-weight:800}
  .bar .right{margin-left:auto;font-weight:600;opacity:.95}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style></head>
<body>
  <div class="brand">Utilverse<span> Data</span></div>
  <span class="badge">규제·인증 공개데이터</span>
  <h1>정제·중복제거된<br/>규제·인증 데이터셋</h1>
  <div class="sub">openFDA 65,049 등록을 7,130 고유 제조사로 정제·중복제거. FDA 계약제조사 + 한국 KC/전파 인증, 바로 쓰는 한 파일로.</div>
  <div class="chips">
    <span class="chip">openFDA · <b>CC0</b></span>
    <span class="chip"><b>65,049</b> 등록</span>
    <span class="chip">→ <b>7,130</b> 고유 제조사</span>
    <span class="chip">월 갱신</span>
  </div>
  <div class="bar"><span class="url mono">data.utilverse.info</span><span class="right">CSV · 구독 · API</span></div>
</body></html>
